name: Update dashboard

on:
  schedule:
    # Every 5 minutes, Mon-Fri, 13:00-21:59 UTC. That covers US market hours in
    # both summer and winter time; the script skips runs outside the session.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the market is closed"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.build.outputs.built }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install yfinance pandas tzdata
      - name: Restore market cap cache
        uses: actions/cache@v4
        with:
          path: market_caps.json
          key: caps-${{ github.run_id }}
          restore-keys: caps-
      - name: Build page
        id: build
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python sector_dashboard.py --no-open --output site/index.html
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            python sector_dashboard.py --hosted --output site/index.html
          fi
      - if: steps.build.outputs.built == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
